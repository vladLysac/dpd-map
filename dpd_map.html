<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <title>DPD Route Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

  <!--#endregion  -->

  <!-- #region App UI Layout & Theme -->
  <style>
    :root {
      --topbar-h: 64px;
      --bottombar-h: 160px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #app {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #map {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--topbar-h);
      bottom: var(--bottombar-h);
      touch-action: none;
      min-height: 200px;
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: calc(8px + env(safe-area-inset-top)) 8px 8px;
      background: rgba(0, 0, 0, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-sizing: border-box;
    }

    #search-wrap {
      width: 100%;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #search-input {
      flex: 1 1 auto;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    #btn-search {
      flex: 0 0 auto;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    #search-results {
      width: 100%;
      margin-top: 8px;
      display: none;
      background: rgba(0, 0, 0, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
    }

    .sr-item {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 13px;
      line-height: 1.25;
    }

    .sr-item:last-child {
      border-bottom: none;
    }

    .sr-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .sr-muted {
      opacity: 0.8;
      font-size: 12px;
      padding: 10px;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;

      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.85);
      box-sizing: border-box;

      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      flex-wrap: wrap;
    }

    #info {
      order: -1;
      padding: 0 0 6px;
      font-size: 12px;
      opacity: 0.95;
      width: 100%;
      flex-basis: 100%;
      line-height: 1.25;
    }

    #info .addr {
      font-size: 13px;
      font-weight: 800;
      opacity: 1;
    }

    #info .status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    #info .region {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.95;
    }

    #info .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid #fff;
      box-sizing: border-box;
    }

    #controls button {
      flex: 1 1 30%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #btn-complete {
      background: #16a34a;
      color: #fff;
    }

    #btn-undo {
      background: #f97316;
      color: #111;
    }

    #btn-gmaps {
      background: #2563eb;
      color: #fff;
    }

    #btn-gmaps:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #btn-follow {
      background: #0b1220;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #btn-follow.active {
      background: #22c55e;
      color: #0b1220;
      border: none;
    }

    #btn-del-pin {
      background: #ef4444;
      color: #fff;
      display: none;
    }

    #btn-share {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border-radius: 10px;
    }



    .leaflet-control-attribution,
    .leaflet-control-attribution a {
      pointer-events: none !important;
    }

    #toast-layer {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: calc(var(--topbar-h) + 10px);
      z-index: 10050;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(520px, calc(100vw - 16px));
      pointer-events: none;
    }

    .toast {
      pointer-events: none;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      font-size: 13px;
      line-height: 1.25;
      color: #fff;
      white-space: pre-line;
    }

    .toast.good {
      border-color: rgba(34, 197, 94, 0.45);
    }

    .toast.warn {
      border-color: rgba(249, 115, 22, 0.45);
    }

    .toast.bad {
      border-color: rgba(239, 68, 68, 0.55);
    }

    /* ===== BIG COMPLETE BUTTON ===== */

    .big-complete {
      width: 100%;
      flex: 0 0 100%;
      padding: 16px 12px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 14px;
      margin-top: 6px;
      background: #16a34a;
      color: white;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>

<!-- #endregion -->

<!-- #region UI Helpers -->

<body>
  <div id="app">
    <div id="toast-layer"></div>
    <div id="topbar">
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Пошук адреси (напр: Hauptstraße 12, Warstein)"
          autocomplete="off">
        <button id="btn-search">🔎</button>
      </div>
      <div id="search-results"></div>
    </div>
    <div id="map"></div>

    <div id="controls">
      <div id="info"></div>
      <button id="btn-follow">🧭 Слідкувати</button>
      <button id="btn-gmaps" disabled>🚗 Маршрут у Google Maps</button>
      <button id="btn-share">🔗</button>
      <button id="btn-del-pin">🗑️ Видалити точку</button>
      <button id="btn-complete">✅ Виконано</button>
    </div>
  </div>
  <!-- endregion -->

  <!--#region Script -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <!-- #endregion -->

  <script>

    //#region UI Error Handling
    function showToast(msg, kind = "warn", ms = 2800) {
      const layer = document.getElementById("toast-layer");
      if (!layer) return;

      const t = document.createElement("div");
      t.className = "toast " + (kind || "warn");
      t.textContent = String(msg || "");
      layer.appendChild(t);

      setTimeout(() => {
        try { t.remove(); } catch (e) { }
      }, Math.max(900, ms));
    }

    function showError(msg) {
      // фатальна помилка: покажемо toast + текст у карті (щоб не було порожньо)
      showToast(msg, "bad", 4500);
      const mapEl = document.getElementById("map");
      if (!mapEl) return;
      mapEl.innerHTML = `<div style="padding:16px;color:#ff8080;font-size:14px;white-space:pre-line;">${String(msg || "")}</div>`;
    }
    // #endregion

    // #region syncLayoutInsets()
    function syncBarsHeight() {
      const topbar = document.getElementById("topbar");
      const controls = document.getElementById("controls");
      const topH = topbar ? Math.max(56, topbar.offsetHeight) : 0;
      const bottomH = controls ? Math.max(120, controls.offsetHeight) : 0;
      document.documentElement.style.setProperty("--topbar-h", topH + "px");
      document.documentElement.style.setProperty("--bottombar-h", bottomH + "px");
      try { if (window.__leafletMap) window.__leafletMap.invalidateSize(); } catch (e) { }
    }
    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      tg.enableClosingConfirmation();

      // ===== OFFLINE SERVICE WORKER (LuxRoute) =====
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("SW registered ✅"))
          .catch(err => console.log("SW error:", err));
      }
    }

    // #endregion

    //#region sendBridgeEvent()
    function sendToBot(payload) {
      if (!tg) return;
      tg.sendData(JSON.stringify(payload));
    }
    // #endregion

    // #region Map Bootstrap & Stops Data Initialization
    (function blockPagePinchZoom() {
      try {
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function (e) { e.preventDefault(); }, { passive: false });
      } catch (e) { }
    })();
    if (!window.L) {
      showError("Помилка: Leaflet не завантажився (об'єкт L відсутній).");
    } else {
      const params = new URLSearchParams(window.location.search);
      function collectStopsParam(p) {
        let combined = "";
        const first = p.get("stops");
        if (first) combined += first;
        for (let i = 2; i <= 99; i++) {
          const key = "stops" + i;
          const part = p.get(key);
          if (!part) break;
          combined += part;
        }
        return combined;
      }

      const SHARE_ROUTE_KEY = "dpd_share_route_parts_v1";

      function splitString(s, maxLen) {
        const out = [];
        for (let i = 0; i < s.length; i += maxLen) out.push(s.slice(i, i + maxLen));
        return out;
      }

      function collectPackedFromQuery(p) {
        let combined = "";
        const first = p.get("r");
        if (first) combined += first;
        for (let i = 2; i <= 99; i++) {
          const key = "r" + i;
          const part = p.get(key);
          if (!part) break;
          combined += part;
        }
        return combined || null;
      }

      function saveRoutePartToLocalStorage(routeKey, index1, total, packedPart) {
        try {
          const raw = localStorage.getItem(SHARE_ROUTE_KEY);
          const db = raw ? JSON.parse(raw) : {};
          if (!db[routeKey]) db[routeKey] = { total, parts: {} };
          db[routeKey].total = total;

          db[routeKey].parts[String(index1)] = packedPart;

          localStorage.setItem(SHARE_ROUTE_KEY, JSON.stringify(db));

          // перевірка “чи вже всі частини є”
          const have = Object.keys(db[routeKey].parts).length;
          if (have >= total) {
            let combined = "";
            for (let i = 1; i <= total; i++) {
              const part = db[routeKey].parts[String(i)];
              if (!part) return { ready: false, have, total, combined: null };
              combined += part;
            }
            return { ready: true, have, total, combined };
          }
          return { ready: false, have, total, combined: null };
        } catch (e) {
          return { ready: false, have: 0, total, combined: null };
        }
      }

      function clearRouteParts(routeKey) {
        try {
          const raw = localStorage.getItem(SHARE_ROUTE_KEY);
          const db = raw ? JSON.parse(raw) : {};
          delete db[routeKey];
          localStorage.setItem(SHARE_ROUTE_KEY, JSON.stringify(db));
        } catch (e) { }
      }


      function buildShareUrls() {
        // 1) будуємо payload як у тебе
        const addrPool = [];
        function addAddr(s) { addrPool.push(String(s || "")); return addrPool.length - 1; }

        const routeStops = stops
          .filter(s => !s.isPinned)
          .map(s => ({
            id: Number(s.id),
            lat: Number(s.lat),
            lng: Number(s.lng),
            done: !!s.done,
            label: s.label ?? "",
            a: addAddr(String(s.address || ""))
          }))
          .filter(s => isFinite(s.id) && isFinite(s.lat) && isFinite(s.lng));

        const payload = {
          v: 2,
          current: (selectedStopId != null ? selectedStopId : 0),
          addr: addrPool,
          stops: routeStops
        };

        const json = JSON.stringify(payload);
        const packed = LZString.compressToEncodedURIComponent(json);

        // 2) ріжемо packed на шматки (тут головний трюк)
        // 1200–1600 символів зазвичай безпечніше для WhatsApp/браузерів.
        const PART_LEN = 1400;
        const parts = splitString(packed, PART_LEN);

        // 3) генеруємо ключ маршруту (щоб localStorage збирав правильний комплект)
        const routeKey = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8)).toLowerCase();

        // 4) робимо список URL: ?rk=...&pi=1&pt=3&r=...&r2=...
        // УВАГА: кожен лінк містить ТІЛЬКИ ОДНУ частину packed (так надійніше).
        const urls = parts.map((part, idx) => {
          const u = new URL(window.location.href);

          // чистимо старе
          u.hash = "";
          u.searchParams.delete("current");
          u.searchParams.delete("stops");
          for (let i = 2; i <= 99; i++) u.searchParams.delete("stops" + i);

          u.searchParams.delete("rk");
          u.searchParams.delete("pi");
          u.searchParams.delete("pt");


          // чистимо r-частини якщо були
          u.searchParams.delete("r");
          for (let i = 2; i <= 99; i++) u.searchParams.delete("r" + i);

          // додаємо службове
          u.searchParams.set("rk", routeKey);
          u.searchParams.set("pi", String(idx + 1));
          u.searchParams.set("pt", String(parts.length));

          // головне: r=part в QUERY
          u.searchParams.set("r", part);

          return u.toString();
        });

        return urls;
      }


      const stopsParam = collectStopsParam(params);
      function getRouteFromHash() {
        const h = (window.location.hash || "").replace(/^#/, "");
        if (!h) return null;
        const sp = new URLSearchParams(h);
        const packed = sp.get("r");
        if (!packed) return null;
        try {
          const json = LZString.decompressFromEncodedURIComponent(packed);
          if (!json) return null;
          const obj = JSON.parse(json);
          return obj;
        } catch (e) {
          return null;
        }
      }

      function getRouteFromQueryParts(params) {
        const routeKey = params.get("rk");
        const pi = parseInt(params.get("pi") || "0", 10);
        const pt = parseInt(params.get("pt") || "0", 10);
        const part = params.get("r");

        // якщо це НЕ part-лінк — пробуємо просто r/r2/r3... як один шматок
        if (!routeKey || !pi || !pt || !part) {
          const packed = collectPackedFromQuery(params); // ти вже написав цю функцію
          if (!packed) return null;
          try {
            const json = LZString.decompressFromEncodedURIComponent(packed);
            if (!json) return null;
            return JSON.parse(json);
          } catch (e) { return null; }
        }

        // це part-лінк: зберігаємо шматок у localStorage
        const res = saveRoutePartToLocalStorage(routeKey, pi, pt, part);

        // якщо ще не всі частини — показуємо повідомлення і НЕ ламаємо карту
        if (!res.ready) {
          showToast(
            `✅ Частина ${pi}/${pt} збережена\nВідкрий наступні лінки по черзі.\nЗібрано: ${res.have}/${pt}`,
            "good",
            3800
          );
          return null;
        }


        // коли всі частини зібрані — декомпрес і парс
        try {
          const json = LZString.decompressFromEncodedURIComponent(res.combined);
          if (!json) return null;
          const obj = JSON.parse(json);

          // (опціонально) чистимо збереження, щоб не засмічувати localStorage
          clearRouteParts(routeKey);

          // (дуже корисно) переводимо в hash-формат і перезавантажуємо сторінку
          // так маршрут відкриється “нормально” одним URL без query
          const clean = new URL(window.location.href);
          clean.search = "";
          clean.hash = "r=" + res.combined;
          window.location.replace(clean.toString());
          return null;
        } catch (e) {
          return null;
        }
      }


      let routeFromHash = null;
      if (!stopsParam) {
        // 1) спочатку пробуємо з query (твій новий share-формат)
        routeFromHash = getRouteFromQueryParts(params);

        // 2) якщо не вийшло — пробуємо старий формат з hash
        if (!routeFromHash) {
          routeFromHash = getRouteFromHash();
        }
      }


      const currentIdFromUrl = parseInt(params.get("current") || "0", 10);
      let currentIdFromHash = 0;
      if (routeFromHash && routeFromHash.current) {
        currentIdFromHash = parseInt(String(routeFromHash.current || "0"), 10) || 0;
      }
      let stops = [];
      function safeDecode(s) {
        try { return decodeURIComponent(s); } catch (e) { return s; }
      }
      if (stopsParam) {
        stops = stopsParam
          .split("|")
          .map((chunk, index) => {
            const parts = chunk.split(",");
            if (parts.length < 4) return null;
            const id = parseInt(parts[0], 10);
            const lat = parseFloat(parts[1]);
            const lng = parseFloat(parts[2]);
            const done = parts[3] === "1";
            if (isNaN(lat) || isNaN(lng) || isNaN(id)) return null;
            let label = index + 1;
            let address = `Зупинка #${index + 1}`;
            if (parts.length >= 5 && parts[4] !== "") {
              const parsedLabel = parseInt(parts[4], 10);
              if (!isNaN(parsedLabel)) label = parsedLabel;
            }
            if (parts.length >= 6) {
              const addrEnc = parts.slice(5).join(",");
              if (addrEnc !== "") address = safeDecode(addrEnc);
            }
            return { id, lat, lng, done, label, address, regionGroup: 0, regionColor: "#ef4444", isPinned: false };
          })
          .filter(Boolean);
      }
      if (!stopsParam && routeFromHash && Array.isArray(routeFromHash.stops)) {
        stops = routeFromHash.stops.map((s, index) => ({
          id: Number(s.id),
          lat: Number(s.lat),
          lng: Number(s.lng),
          done: !!s.done,
          label: (s.label ?? (index + 1)),
          address: String(
            (s.address !== undefined)
              ? s.address
              : ((routeFromHash.addr || [])[s.a] || `Зупинка #${index + 1}`)
          ),

          regionGroup: 0,
          regionColor: "#ef4444",
          isPinned: false
        })).filter(s => isFinite(s.id) && isFinite(s.lat) && isFinite(s.lng));
      }

      if (!stops.length) {
        stops = [];
      }

      const REGION_COLORS = [
        "#ef4444", "#3b82f6", "#eab308", "#a855f7",
        "#22c55e", "#f97316", "#14b8a6", "#ec4899",
        "#84cc16", "#06b6d4", "#f43f5e", "#8b5cf6",
      ];
      let regionGroup = 1;
      stops.forEach((s, i) => {
        if (i > 0 && s.label === 1) regionGroup++;
        s.regionGroup = regionGroup;
        s.regionColor = REGION_COLORS[(regionGroup - 1) % REGION_COLORS.length];
      });
      const PIN_STORE_KEY = "dpd_pinned_stops_v1";
      function loadPinnedStops() {
        try {
          const raw = localStorage.getItem(PIN_STORE_KEY);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return [];
          return arr
            .map(p => {
              const lat = Number(p.lat);
              const lng = Number(p.lng);
              const id = String(p.id || "");
              if (!id || !isFinite(lat) || !isFinite(lng)) return null;
              return {
                id,
                lat,
                lng,
                done: false,
                label: "📍",
                address: p.address ? String(p.address) : "Точка на карті",
                regionGroup: 0,
                regionColor: "#a855f7",
                isPinned: true
              };
            })
            .filter(Boolean);
        } catch (e) {
          return [];
        }
      }

      // #endregion

      // #region Map Initialization & State Setup

      function savePinnedStops() {
        try {
          const pins = stops.filter(s => s.isPinned).map(s => ({
            id: s.id,
            lat: s.lat,
            lng: s.lng,
            address: s.address
          }));
          localStorage.setItem(PIN_STORE_KEY, JSON.stringify(pins));
        } catch (e) { }
      }
      const pinnedLoaded = loadPinnedStops();
      if (pinnedLoaded.length) stops = stops.concat(pinnedLoaded);
      let selectedStopId =
        ((currentIdFromHash || currentIdFromUrl) && stops.find((s) => s.id === (currentIdFromHash || currentIdFromUrl))?.id) ||
        (stops[0] && stops[0].id) ||
        null;
      const markers = new Map();
      const map = L.map("map", { rotate: true, bearing: 0 });
      window.__leafletMap = map;
      if (stops.length > 0) {
        const avgLat = stops.reduce((sum, s) => sum + s.lat, 0) / stops.length;
        const avgLng = stops.reduce((sum, s) => sum + s.lng, 0) / stops.length;
        map.setView([avgLat, avgLng], 14);
      } else {
        map.setView([51.7191, 8.7544], 12);
      }
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      try {
        if (map.attributionControl && map.attributionControl.setPrefix) {
          map.attributionControl.setPrefix("");
        }
      } catch (e) { }
      (function enableMobileTwistRotate() {
        try {
          const container = map.getContainer();
          if (!container || !map.setBearing || !map.getBearing) return;
          container.style.touchAction = "manipulation";
          const pointers = new Map();
          let rotating = false;
          let startAngle = 0;
          let startBearing = 0;
          function angleBetween(p1, p2) { return Math.atan2(p2.y - p1.y, p2.x - p1.x); }
          function radToDeg(r) { return r * 180 / Math.PI; }
          function normalizeDeg(d) { d = d % 360; if (d < 0) d += 360; return d; }
          container.addEventListener("pointerdown", (e) => {
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pointers.size === 2) {
              const arr = Array.from(pointers.values());
              startAngle = angleBetween(arr[0], arr[1]);
              startBearing = map.getBearing() || 0;
              rotating = false;
            }
          }, { passive: true });
          container.addEventListener("pointermove", (e) => {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (pointers.size !== 2) return;
            const arr = Array.from(pointers.values());
            const a = angleBetween(arr[0], arr[1]);
            const deltaDeg = radToDeg(a - startAngle);
            if (!rotating) {
              if (Math.abs(deltaDeg) < 6) return;
              rotating = true;
            }
            e.preventDefault();
            const newBearing = normalizeDeg(startBearing + deltaDeg);
            map.setBearing(newBearing);
          }, { passive: false });

          // #endregion

          // #region Map Gesture Controls

          function endPointer(e) {
            if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
            if (pointers.size < 2) rotating = false;
          }
          container.addEventListener("pointerup", endPointer, { passive: true });
          container.addEventListener("pointercancel", endPointer, { passive: true });
          container.addEventListener("pointerout", endPointer, { passive: true });
          container.addEventListener("pointerleave", endPointer, { passive: true });
        } catch (err) {
          console.log("Mobile rotate init error:", err);
        }
      })();

      // #endregion

      // #region Marker Styling & UI References

      function getStopById(id) {
        return stops.find((s) => s.id === id);
      }
      function updateMarkerStyle(id) {
        const marker = markers.get(id);
        if (!marker) return;
        const stop = getStopById(id);
        if (!stop) return;
        const isSelected = selectedStopId === id;
        const bgColor = stop.isPinned
          ? "#a855f7"
          : (stop.done ? "#6b7280" : (stop.regionColor || "#ef4444"));
        const borderColor = isSelected ? "#22c55e" : "#ffffff";
        const size = isSelected ? 28 : 22;
        const text = stop.label ?? "";
        const iconHtml = `
        <div style="
          width:${size}px;
          height:${size}px;
          border-radius:50%;
          background:${bgColor};
          border:2px solid ${borderColor};
          box-shadow:0 0 8px rgba(0,0,0,0.7);
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:${stop.isPinned ? 14 : 12}px;
          color:#fff;
          font-weight:800;
        ">
          ${text}
        </div>
      `;
        const icon = L.divIcon({
          html: iconHtml,
          className: "custom-marker",
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        });
        marker.setIcon(icon);
      }
      const infoEl = document.getElementById("info");
      const btnComplete = document.getElementById("btn-complete");
      const btnGmaps = document.getElementById("btn-gmaps");
      const btnFollow = document.getElementById("btn-follow");
      const btnDelPin = document.getElementById("btn-del-pin");
      const btnShare = document.getElementById("btn-share");
      const searchInput = document.getElementById("search-input");
      const btnSearch = document.getElementById("btn-search");
      const searchResults = document.getElementById("search-results");
      let currentGmapsUrl = null;

      // #endregion

      // #region Stop Interaction & Controls

      function setPinnedDeleteUI(stop) {
        if (stop && stop.isPinned) btnDelPin.style.display = "inline-block";
        else btnDelPin.style.display = "none";
        syncBarsHeight();
      }

      function renderInfo() {
        const stop = getStopById(selectedStopId);
        if (!stop) {
          infoEl.innerHTML = "";
          setPinnedDeleteUI(null);
          return;
        }
        const statusText = stop.isPinned
          ? "📌 Закріплена точка"
          : (stop.done ? "✅ Доставлено" : "❌ Ще не доставлено");
        const coordsText = `(${stop.lat.toFixed(5)}, ${stop.lng.toFixed(5)})`;
        const regionHtml = (!stop.isPinned && stop.regionGroup > 0) ? `
        <div class="region">
          <span class="dot" style="background:${stop.regionColor};"></span>
          <span>Район #${stop.regionGroup}</span>
        </div>
      ` : `
        <div class="region" style="opacity:0.9;">
          <span class="dot" style="background:${stop.isPinned ? "#a855f7" : "#6b7280"};"></span>
          <span>${coordsText}</span>
        </div>
      `;
        infoEl.innerHTML = `
        <div class="addr">${stop.address}</div>
        <div class="status">${statusText}</div>
        ${regionHtml}
      `;
        setPinnedDeleteUI(stop);
        syncBarsHeight();
      }


      function updateGmapsButton(stop) {
        if (!stop) {
          currentGmapsUrl = null;
          btnGmaps.disabled = true;
          return;
        }
        const dest = `${stop.lat},${stop.lng}`;
        const gmapsUrl =
          "https://www.google.com/maps/dir/?api=1&destination=" +
          encodeURIComponent(dest) +
          "&travelmode=driving";
        currentGmapsUrl = gmapsUrl;
        btnGmaps.disabled = false;
      }


      function selectStop(id, doPan = true) {
        selectedStopId = id;
        markers.forEach((_m, key) => updateMarkerStyle(key));
        const stop = getStopById(id);
        if (stop && doPan) map.panTo([stop.lat, stop.lng]);
        renderInfo();
        updateGmapsButton(stop);
      }


      function addStopMarker(stop) {
        const marker = L.marker([stop.lat, stop.lng]).addTo(map);
        markers.set(stop.id, marker);
        marker.on("click", () => {
          selectStop(stop.id);
          let popupHtml = "";
          if (stop.isPinned) {
            popupHtml = `<b>📍 Закріплена точка</b><br>${stop.address}`;
          } else {
            popupHtml = `
              <b>${stop.address}</b><br>
              Зупинка: #${stop.label}<br>
              Район: #${stop.regionGroup}`;
          }
          marker.bindPopup(popupHtml, { autoClose: true }).openPopup();
        });
        updateMarkerStyle(stop.id);
      }
      stops.forEach(addStopMarker);
      if (selectedStopId !== null) {
        selectStop(selectedStopId, false);
      } else {
        btnGmaps.disabled = true;
        currentGmapsUrl = null;
        btnDelPin.style.display = "none";
        syncBarsHeight();
      }


      (function enableLongPressPin() {
        const container = map.getContainer();
        let pressTimer = null;
        let startX = 0, startY = 0;
        let activePointerId = null;
        let moved = false;
        const HOLD_MS = 550;
        const MOVE_PX = 12;


        function clearPress() {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
          activePointerId = null;
          moved = false;
        }
        // #endregion

        // #region Pinned Stop Creation & Long Press

        function createPinnedStop(lat, lng, addressText) {
          const id = "pinned_" + Date.now();
          const stop = {
            id,
            lat,
            lng,
            done: false,
            label: "📍",
            address: addressText || "Точка на карті",
            regionGroup: 0,
            regionColor: "#a855f7",
            isPinned: true
          };
          stops.push(stop);
          addStopMarker(stop);
          savePinnedStops();
          selectStop(stop.id);
          map.setView([lat, lng], Math.max(map.getZoom(), 16));
          syncBarsHeight();
        }


        function createPinnedAt(latlng) {
          createPinnedStop(latlng.lat, latlng.lng, "Точка на карті");
        }
        map.on("movestart zoomstart rotatestart dragstart", clearPress);
        container.addEventListener("pointerdown", (e) => {
          if (activePointerId !== null) return;
          activePointerId = e.pointerId;
          startX = e.clientX;
          startY = e.clientY;
          moved = false;
          pressTimer = setTimeout(() => {
            pressTimer = null;
            if (moved) return;
            if (e.target && (e.target.closest(".leaflet-marker-pane") || e.target.closest(".leaflet-control"))) {
              return;
            }
            const latlng = map.mouseEventToLatLng(e);
            if (!latlng) return;
            try { if (navigator.vibrate) navigator.vibrate(25); } catch (_) { }
            createPinnedAt(latlng);
          }, HOLD_MS);
        }, { passive: true });
        container.addEventListener("pointermove", (e) => {
          if (activePointerId !== e.pointerId) return;
          const dx = Math.abs(e.clientX - startX);
          const dy = Math.abs(e.clientY - startY);
          if (dx > MOVE_PX || dy > MOVE_PX) {
            moved = true;
            clearPress();
          }
        }, { passive: true });
        container.addEventListener("pointerup", (e) => {
          if (activePointerId !== e.pointerId) return;
          clearPress();
        }, { passive: true });
        container.addEventListener("pointercancel", clearPress, { passive: true });
        container.addEventListener("pointerleave", clearPress, { passive: true });
        window.__createPinnedStop = createPinnedStop;
      })();

      // #endregion 

      // #region Address Search & Geolocation

      const NOMINATIM_URL = "https://nominatim.openstreetmap.org/search";
      const NOMINATIM_LIMIT = 6;
      const CONTACT_EMAIL = "";
      const searchCache = new Map();
      let debounceTimer = null;
      let lastRequestAt = 0;
      let inFlight = false;
      let pendingQuery = "";
      function normalizeQuery(q) {
        return String(q || "").trim().replace(/\s+/g, " ");
      }


      function showResults(items) {
        if (!items || !items.length) {
          searchResults.style.display = "block";
          searchResults.innerHTML = `<div class="sr-muted">Нічого не знайдено</div>`;
          syncBarsHeight();
          return;
        }
        searchResults.style.display = "block";
        searchResults.innerHTML = items.map((it, idx) => `
        <div class="sr-item" data-idx="${idx}">
          ${it.display_name}
        </div>
      `).join("");
        Array.from(searchResults.querySelectorAll(".sr-item")).forEach(el => {
          el.addEventListener("click", () => {
            const i = Number(el.getAttribute("data-idx"));
            const r = items[i];
            if (!r) return;
            searchResults.style.display = "none";
            const lat = Number(r.lat);
            const lon = Number(r.lon);
            if (!isFinite(lat) || !isFinite(lon)) return;
            if (window.__createPinnedStop) {
              window.__createPinnedStop(lat, lon, r.display_name);
            } else {
              map.setView([lat, lon], 16);
            }
            searchInput.value = "";
            syncBarsHeight();
          });
        });
        syncBarsHeight();
      }


      function hideResults() {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        syncBarsHeight();
      }
      async function nominatimSearch(query) {
        const q = normalizeQuery(query);
        if (!q) return [];
        if (searchCache.has(q)) return searchCache.get(q);
        const now = Date.now();
        const wait = Math.max(0, 1100 - (now - lastRequestAt));
        if (wait > 0) await new Promise(res => setTimeout(res, wait));
        lastRequestAt = Date.now();
        const url = new URL(NOMINATIM_URL);
        url.searchParams.set("format", "json");
        url.searchParams.set("q", q);
        url.searchParams.set("limit", String(NOMINATIM_LIMIT));
        url.searchParams.set("addressdetails", "0");
        if (CONTACT_EMAIL) url.searchParams.set("email", CONTACT_EMAIL);
        const resp = await fetch(url.toString(), {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "Accept-Language": "uk,en;q=0.8,de;q=0.6"
          }
        });
        if (!resp.ok) throw new Error("Nominatim HTTP " + resp.status);
        const data = await resp.json();
        const arr = Array.isArray(data) ? data : [];
        searchCache.set(q, arr);
        return arr;
      }


      async function runSearch(query) {
        const q = normalizeQuery(query);
        if (!q) { hideResults(); return; }
        pendingQuery = q;
        if (inFlight) return;
        inFlight = true;
        try {
          const results = await nominatimSearch(pendingQuery);
          showResults(results);
        } catch (e) {
          searchResults.style.display = "block";
          searchResults.innerHTML = `<div class="sr-muted">Помилка пошуку (Nominatim). Спробуй ще раз.</div>`;
          syncBarsHeight();
        } finally {
          inFlight = false;
          const latest = normalizeQuery(searchInput.value);
          if (latest && latest !== pendingQuery) {
            runSearch(latest);
          }
        }
      }

      function scheduleSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runSearch(searchInput.value), 500);
      }
      searchInput.addEventListener("input", scheduleSearch);
      btnSearch.addEventListener("click", () => runSearch(searchInput.value));
      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          runSearch(searchInput.value);
        }
        if (e.key === "Escape") {
          hideResults();
          searchInput.blur();
        }
      });
      document.addEventListener("click", (e) => {
        const t = e.target;
        if (!t) return;
        if (t.closest("#topbar") || t.closest("#search-results")) return;
        hideResults();
      });
      let userMarker = null;
      let lastUserPos = null;
      let watchId = null;

      function animateLatLngCircleMarker(marker, from, to, duration = 500) {
        const start = performance.now();
        const lat1 = from[0], lng1 = from[1];
        const lat2 = to[0], lng2 = to[1];

        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          const lat = lat1 + (lat2 - lat1) * t;
          const lng = lng1 + (lng2 - lng1) * t;
          marker.setLatLng([lat, lng]);
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }
      // #endregion

      // #region Follow Mode (GPS Tracking)

      let followEnabled = false;

      function setFollowUI() {
        if (followEnabled) btnFollow.classList.add("active");
        else btnFollow.classList.remove("active");
      }

      function enableFollow() {
        followEnabled = true;
        setFollowUI();
        if (lastUserPos) map.panTo(lastUserPos, { animate: true });
      }

      function disableFollow() {
        followEnabled = false;
        setFollowUI();
      }

      btnFollow.addEventListener("click", () => {
        if (followEnabled) disableFollow();
        else enableFollow();
      });
      if (navigator.geolocation) {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const latlng = [latitude, longitude];
            if (userMarker && accuracy && accuracy > 120) return;
            if (!userMarker) {
              userMarker = L.circleMarker(latlng, {
                radius: 8,
                fillColor: "#4ade80",
                color: "#22c55e",
                weight: 2,
                opacity: 1,
                fillOpacity: 1,
              }).addTo(map);
              userMarker.bindPopup("Ти тут 😊");
              lastUserPos = latlng;
            } else {
              animateLatLngCircleMarker(userMarker, lastUserPos, latlng, 500);
              lastUserPos = latlng;
            }

            if (followEnabled && lastUserPos) map.panTo(lastUserPos, { animate: true });
          },
          (err) => {
            console.log("Geo error", err);
          },
          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 8000
          }
        );
      }

      // #endregion

      // #region Action Buttons Handlers
      btnComplete.addEventListener("click", () => {
        if (selectedStopId == null) return;
        const stop = getStopById(selectedStopId);
        if (!stop) return;
        if (stop.isPinned) return;
        stop.done = true;
        updateMarkerStyle(stop.id);
        renderInfo();
        sendToBot({ action: "complete", stop_id: stop.id });
      });

      btnGmaps.addEventListener("click", () => {
        if (!currentGmapsUrl) return;
        window.open(currentGmapsUrl, "_blank");
      });

      let shareStep = 0;
      let shareCache = null;

      btnShare.addEventListener("click", async () => {
        if (!shareCache) {
          shareCache = buildShareUrls();
          shareStep = 0;
        }

        const urls = shareCache;
        if (!urls || !urls.length) {
          showToast("ℹ️ Немає що шарити (0 точок).", "warn", 2800);
          shareCache = null;
          return;
        }

        const url = urls[shareStep];
        if (!url) {
          shareCache = null;
          alert("✅ Усі частини вже відправлені. Натисни Share ще раз, щоб згенерувати заново.");
          return;
        }

        const msg = `DPD Route — Part ${shareStep + 1}/${urls.length}\nВідкрий цей лінк. Потім натисни Share ще раз для наступного.`;

        // якщо є share — шлемо ОДИН лінк
        if (navigator.share) {
          try {
            await navigator.share({ title: "DPD Route", text: msg, url });
            shareStep++;
            if (shareStep >= urls.length) {
              shareCache = null;
              alert("✅ Усі частини відправлені!");
            }
            return;
          } catch (e) { }
        }

        // fallback: копіюємо ОДИН лінк
        try {
          await navigator.clipboard.writeText(url);
          alert(`✅ Скопійовано Part ${shareStep + 1}/${urls.length}\nВстав у WhatsApp і відправ.\nПотім натисни Share ще раз.`);
        } catch (e) {
          window.prompt("Скопіюй лінк:", url);
        }

        shareStep++;
        if (shareStep >= urls.length) {
          shareCache = null;
          alert("✅ Усі частини готові. Якщо треба — натисни Share ще раз, щоб згенерувати заново.");
        }
      });



      btnDelPin.addEventListener("click", () => {
        const stop = getStopById(selectedStopId);
        if (!stop || !stop.isPinned) return;

        const marker = markers.get(stop.id);
        if (marker) {
          try { map.removeLayer(marker); } catch (e) { }
          markers.delete(stop.id);
        }

        stops = stops.filter(s => s.id !== stop.id);
        savePinnedStops();

        selectedStopId = stops[0] ? stops[0].id : null;
        if (selectedStopId !== null) selectStop(selectedStopId, false);
        else {
          infoEl.innerHTML = "";
          btnGmaps.disabled = true;
          btnDelPin.style.display = "none";
        }

        syncBarsHeight();
      });

      syncBarsHeight();
      setTimeout(syncBarsHeight, 50);
      setTimeout(syncBarsHeight, 250);
      window.addEventListener("resize", syncBarsHeight);
    }

    // #endregion

  </script>

</body>
