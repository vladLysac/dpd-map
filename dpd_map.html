<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <title>DPD Route Map</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>

  <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>

  <style>
    :root {
      --topbar-h: 64px;
      --bottombar-h: 160px;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #app {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #map {
      position: absolute;
      left: 0;
      right: 0;
      top: var(--topbar-h);
      bottom: var(--bottombar-h);
      touch-action: none;
      min-height: 200px;
    }

    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      padding: calc(8px + env(safe-area-inset-top)) 8px 8px;
      background: rgba(0, 0, 0, 0.92);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-sizing: border-box;
    }

    #search-wrap {
      width: 100%;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #search-input {
      flex: 1 1 auto;
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      outline: none;
      font-size: 14px;
    }

    #search-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    #btn-search {
      flex: 0 0 auto;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.10);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    #search-results {
      width: 100%;
      margin-top: 8px;
      display: none;
      background: rgba(0, 0, 0, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
    }

    .sr-item {
      padding: 10px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 13px;
      line-height: 1.25;
    }

    .sr-item:last-child {
      border-bottom: none;
    }

    .sr-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .sr-muted {
      opacity: 0.8;
      font-size: 12px;
      padding: 10px;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;

      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.85);
      box-sizing: border-box;

      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      flex-wrap: wrap;
    }

    #info {
      order: -1;
      padding: 0 0 6px;
      font-size: 12px;
      opacity: 0.95;
      width: 100%;
      flex-basis: 100%;
      line-height: 1.25;
    }

    #info .addr {
      font-size: 13px;
      font-weight: 800;
      opacity: 1;
    }

    #info .status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }

    #info .region {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      opacity: 0.95;
    }

    #info .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 2px solid #fff;
      box-sizing: border-box;
    }

    #controls button {
      flex: 1 1 30%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #btn-complete {
      background: #16a34a;
      color: #fff;
    }

    #btn-undo {
      background: #f97316;
      color: #111;
    }

    #btn-gmaps {
      background: #2563eb;
      color: #fff;
    }

    #btn-gmaps:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #btn-follow {
      background: #0b1220;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #btn-follow.active {
      background: #22c55e;
      color: #0b1220;
      border: none;
    }

    #btn-del-pin {
      background: #ef4444;
      color: #fff;
      display: none;
    }

    /* ✅ НОВА КНОПКА "1️⃣ Перша" (BOTTOM BAR) */
    #btn-first {
      background: #22c55e;
      color: #0b1220;
      display: none;
      font-weight: 900;
    }

    .leaflet-control-attribution,
    .leaflet-control-attribution a {
      pointer-events: none !important;
    }

    .popup-actions {
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }

    .btn-first-stop {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: #0b1220;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="app">
    <div id="topbar">
      <div id="search-wrap">
        <input id="search-input" type="text" placeholder="Пошук адреси (напр: Hauptstraße 12, Warstein)"
          autocomplete="off">
        <button id="btn-search">🔎</button>
      </div>
      <div id="search-results"></div>
    </div>

    <div id="map"></div>

    <div id="controls">
      <div id="info"></div>
      <button id="btn-undo">↩️ Повернути</button>
      <button id="btn-complete">✅ Виконано</button>
      <button id="btn-first">1️⃣ Перша</button>
      <button id="btn-follow">🧭 Слідкувати</button>
      <button id="btn-gmaps" disabled>🚗 Маршрут у Google Maps</button>
      <button id="btn-del-pin">🗑️ Видалити точку</button>
    </div>
  </div>

  <script>
    function showError(msg) {
      const el = document.createElement("div");
      el.style.padding = "16px";
      el.style.color = "#ff8080";
      el.style.fontSize = "14px";
      el.textContent = msg;
      const mapEl = document.getElementById("map");
      mapEl.innerHTML = "";
      mapEl.appendChild(el);
    }

    function syncBarsHeight() {
      const topbar = document.getElementById("topbar");
      const controls = document.getElementById("controls");

      const topH = topbar ? Math.max(56, topbar.offsetHeight) : 0;
      const bottomH = controls ? Math.max(120, controls.offsetHeight) : 0;

      document.documentElement.style.setProperty("--topbar-h", topH + "px");
      document.documentElement.style.setProperty("--bottombar-h", bottomH + "px");

      try { if (window.__leafletMap) window.__leafletMap.invalidateSize(); } catch (e) { }
    }

    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.expand();
      tg.enableClosingConfirmation();
    } else {
      console.log("Running outside Telegram WebApp – demo mode.");
    }

    (function blockPagePinchZoom() {
      try {
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
        document.addEventListener("gestureend", function (e) { e.preventDefault(); }, { passive: false });
      } catch (e) { }
    })();

    if (!window.L) {
      showError("Помилка: Leaflet не завантажився (об'єкт L відсутній).");
    } else {
      const params = new URLSearchParams(window.location.search);

      function collectStopsParam(p) {
        let combined = "";
        const first = p.get("stops");
        if (first) combined += first;

        for (let i = 2; i <= 99; i++) {
          const key = "stops" + i;
          const part = p.get(key);
          if (!part) break;
          combined += part;
        }
        return combined;
      }

      const stopsParam = collectStopsParam(params);
      const currentIdFromUrl = parseInt(params.get("current") || "0", 10);

      let stops = [];

      function safeDecode(s) {
        try { return decodeURIComponent(s); } catch (e) { return s; }
      }

      if (stopsParam) {
        stops = stopsParam
          .split("|")
          .map((chunk, index) => {
            const parts = chunk.split(",");
            if (parts.length < 4) return null;

            const id = parseInt(parts[0], 10);
            const lat = parseFloat(parts[1]);
            const lng = parseFloat(parts[2]);
            const done = parts[3] === "1";

            if (isNaN(lat) || isNaN(lng) || isNaN(id)) return null;

            let label = index + 1;
            let address = `Зупинка #${index + 1}`;

            if (parts.length >= 5 && parts[4] !== "") {
              const parsedLabel = parseInt(parts[4], 10);
              if (!isNaN(parsedLabel)) label = parsedLabel;
            }

            if (parts.length >= 6) {
              const addrEnc = parts.slice(5).join(",");
              if (addrEnc !== "") address = safeDecode(addrEnc);
            }

            return { id, lat, lng, done, label, address, regionGroup: 0, regionColor: "#ef4444", isPinned: false };
          })
          .filter(Boolean);
      }

      if (!stops.length) {
        stops = [
          { id: 1, lat: 51.7005, lng: 8.7642, address: "Warburger Straße 3A, Paderborn", done: false, label: 1, regionGroup: 1, regionColor: "#ef4444", isPinned: false },
          { id: 2, lat: 51.7020, lng: 8.7610, address: "Dahler Str. 2, Paderborn", done: false, label: 2, regionGroup: 1, regionColor: "#ef4444", isPinned: false },
          { id: 3, lat: 51.7050, lng: 8.7600, address: "Sebastianstraße 7, Paderborn", done: false, label: 1, regionGroup: 2, regionColor: "#3b82f6", isPinned: false },
        ];
      }

      const REGION_COLORS = [
        "#ef4444", "#3b82f6", "#eab308", "#a855f7",
        "#22c55e", "#f97316", "#14b8a6", "#ec4899",
        "#84cc16", "#06b6d4", "#f43f5e", "#8b5cf6",
      ];

      let regionGroup = 1;
      stops.forEach((s, i) => {
        if (i > 0 && s.label === 1) regionGroup++;
        s.regionGroup = regionGroup;
        s.regionColor = REGION_COLORS[(regionGroup - 1) % REGION_COLORS.length];
      });

      const PIN_STORE_KEY = "dpd_pinned_stops_v1";

      function loadPinnedStops() {
        try {
          const raw = localStorage.getItem(PIN_STORE_KEY);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          if (!Array.isArray(arr)) return [];
          return arr
            .map(p => {
              const lat = Number(p.lat);
              const lng = Number(p.lng);
              const id = String(p.id || "");
              if (!id || !isFinite(lat) || !isFinite(lng)) return null;
              return {
                id,
                lat,
                lng,
                done: false,
                label: "📍",
                address: p.address ? String(p.address) : "Точка на карті",
                regionGroup: 0,
                regionColor: "#a855f7",
                isPinned: true
              };
            })
            .filter(Boolean);
        } catch (e) {
          return [];
        }
      }

      function savePinnedStops() {
        try {
          const pins = stops.filter(s => s.isPinned).map(s => ({
            id: s.id,
            lat: s.lat,
            lng: s.lng,
            address: s.address
          }));
          localStorage.setItem(PIN_STORE_KEY, JSON.stringify(pins));
        } catch (e) { }
      }

      const pinnedLoaded = loadPinnedStops();
      if (pinnedLoaded.length) {
        stops = stops.concat(pinnedLoaded);
      }

      let selectedStopId =
        (currentIdFromUrl && stops.find((s) => s.id === currentIdFromUrl)?.id) ||
        (stops[0] && stops[0].id) ||
        null;

      const markers = new Map();

      const map = L.map("map", { rotate: true, bearing: 0 });
      window.__leafletMap = map;

      if (stops.length > 0) {
        const avgLat = stops.reduce((sum, s) => sum + s.lat, 0) / stops.length;
        const avgLng = stops.reduce((sum, s) => sum + s.lng, 0) / stops.length;
        map.setView([avgLat, avgLng], 14);
      } else {
        map.setView([51.7191, 8.7544], 12);
      }

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      try {
        if (map.attributionControl && map.attributionControl.setPrefix) {
          map.attributionControl.setPrefix("");
        }
      } catch (e) { }

      (function enableMobileTwistRotate() {
        try {
          const container = map.getContainer();
          if (!container || !map.setBearing || !map.getBearing) return;

          container.style.touchAction = "manipulation";

          const pointers = new Map();
          let rotating = false;
          let startAngle = 0;
          let startBearing = 0;

          function angleBetween(p1, p2) { return Math.atan2(p2.y - p1.y, p2.x - p1.x); }
          function radToDeg(r) { return r * 180 / Math.PI; }
          function normalizeDeg(d) { d = d % 360; if (d < 0) d += 360; return d; }

          container.addEventListener("pointerdown", (e) => {
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (pointers.size === 2) {
              const arr = Array.from(pointers.values());
              startAngle = angleBetween(arr[0], arr[1]);
              startBearing = map.getBearing() || 0;
              rotating = false;
            }
          }, { passive: true });

          container.addEventListener("pointermove", (e) => {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (pointers.size !== 2) return;

            const arr = Array.from(pointers.values());
            const a = angleBetween(arr[0], arr[1]);
            const deltaDeg = radToDeg(a - startAngle);

            if (!rotating) {
              if (Math.abs(deltaDeg) < 6) return;
              rotating = true;
            }

            e.preventDefault();
            const newBearing = normalizeDeg(startBearing + deltaDeg);
            map.setBearing(newBearing);
          }, { passive: false });

          function endPointer(e) {
            if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
            if (pointers.size < 2) rotating = false;
          }

          container.addEventListener("pointerup", endPointer, { passive: true });
          container.addEventListener("pointercancel", endPointer, { passive: true });
          container.addEventListener("pointerout", endPointer, { passive: true });
          container.addEventListener("pointerleave", endPointer, { passive: true });
        } catch (err) {
          console.log("Mobile rotate init error:", err);
        }
      })();

      function getStopById(id) {
        return stops.find((s) => s.id === id);
      }

      function updateMarkerStyle(id) {
        const marker = markers.get(id);
        if (!marker) return;
        const stop = getStopById(id);
        if (!stop) return;

        const isSelected = selectedStopId === id;

        const bgColor = stop.isPinned
          ? "#a855f7"
          : (stop.done ? "#6b7280" : (stop.regionColor || "#ef4444"));

        const borderColor = isSelected ? "#22c55e" : "#ffffff";
        const size = isSelected ? 28 : 22;

        const text = stop.label ?? "";

        const iconHtml = `
        <div style="
          width:${size}px;
          height:${size}px;
          border-radius:50%;
          background:${bgColor};
          border:2px solid ${borderColor};
          box-shadow:0 0 8px rgba(0,0,0,0.7);
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:${stop.isPinned ? 14 : 12}px;
          color:#fff;
          font-weight:800;
        ">
          ${text}
        </div>
      `;

        const icon = L.divIcon({
          html: iconHtml,
          className: "custom-marker",
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
        });
        marker.setIcon(icon);
      }

      const infoEl = document.getElementById("info");
      const btnComplete = document.getElementById("btn-complete");
      const btnUndo = document.getElementById("btn-undo");
      const btnGmaps = document.getElementById("btn-gmaps");
      const btnFollow = document.getElementById("btn-follow");
      const btnDelPin = document.getElementById("btn-del-pin");
      const btnFirst = document.getElementById("btn-first");

      const searchInput = document.getElementById("search-input");
      const btnSearch = document.getElementById("btn-search");
      const searchResults = document.getElementById("search-results");

      let currentGmapsUrl = null;

      function setPinnedDeleteUI(stop) {
        if (stop && stop.isPinned) btnDelPin.style.display = "inline-block";
        else btnDelPin.style.display = "none";
        syncBarsHeight();
      }

      /* ✅ НОВЕ: показ/ховати кнопку "1️⃣ Перша" */
      function setFirstButtonUI(stop) {
        if (!stop || stop.isPinned) {
          btnFirst.style.display = "none";
        } else {
          btnFirst.style.display = "inline-block";
        }
        syncBarsHeight();
      }

      function renderInfo() {
        const stop = getStopById(selectedStopId);
        if (!stop) {
          infoEl.innerHTML = "";
          setPinnedDeleteUI(null);
          setFirstButtonUI(null);
          return;
        }

        const statusText = stop.isPinned
          ? "📌 Закріплена точка"
          : (stop.done ? "✅ Доставлено" : "❌ Ще не доставлено");

        const coordsText = `(${stop.lat.toFixed(5)}, ${stop.lng.toFixed(5)})`;

        const regionHtml = (!stop.isPinned && stop.regionGroup > 0) ? `
        <div class="region">
          <span class="dot" style="background:${stop.regionColor};"></span>
          <span>Район #${stop.regionGroup}</span>
        </div>
      ` : `
        <div class="region" style="opacity:0.9;">
          <span class="dot" style="background:${stop.isPinned ? "#a855f7" : "#6b7280"};"></span>
          <span>${coordsText}</span>
        </div>
      `;

        infoEl.innerHTML = `
        <div class="addr">${stop.address}</div>
        <div class="status">${statusText}</div>
        ${regionHtml}
      `;

        setPinnedDeleteUI(stop);
        setFirstButtonUI(stop);
        syncBarsHeight();
      }

      function updateGmapsButton(stop) {
        if (!stop) {
          currentGmapsUrl = null;
          btnGmaps.disabled = true;
          return;
        }

        const dest = `${stop.lat},${stop.lng}`;
        const gmapsUrl =
          "https://www.google.com/maps/dir/?api=1&destination=" +
          encodeURIComponent(dest) +
          "&travelmode=driving";

        currentGmapsUrl = gmapsUrl;
        btnGmaps.disabled = false;
      }

      function selectStop(id, doPan = true) {
        selectedStopId = id;
        markers.forEach((_m, key) => updateMarkerStyle(key));
        const stop = getStopById(id);
        if (stop && doPan) map.panTo([stop.lat, stop.lng]);
        renderInfo();
        updateGmapsButton(stop);
      }

      function addStopMarker(stop) {
        const marker = L.marker([stop.lat, stop.lng]).addTo(map);
        markers.set(stop.id, marker);

        marker.on("click", () => {
          selectStop(stop.id);

          let popupHtml = "";

          if (stop.isPinned) {
            popupHtml = `<b>📍 Закріплена точка</b><br>${stop.address}`;
          } else {
            /* ✅ ВАЖЛИВО: без inline onclick — робимо data-stop-id */
            popupHtml = `
              <b>${stop.address}</b><br>
              Зупинка: #${stop.label}<br>
              Район: #${stop.regionGroup}

              <div class="popup-actions">
                <button class="btn-first-stop" data-stop-id="${stop.id}">
                  1️⃣ перша
                </button>
              </div>
            `;
          }

          marker.bindPopup(popupHtml, { autoClose: true }).openPopup();
        });

        updateMarkerStyle(stop.id);
      }

      stops.forEach(addStopMarker);

      if (selectedStopId !== null) {
        selectStop(selectedStopId, false);
      } else {
        btnGmaps.disabled = true;
        currentGmapsUrl = null;
        btnDelPin.style.display = "none";
        btnFirst.style.display = "none";
        syncBarsHeight();
      }

      /* ✅ НОВЕ: надійний обробник кнопки в popup (мобільний фікс) */
      map.on("popupopen", (e) => {
        try {
          const el = e.popup.getElement();
          if (!el) return;

          const btn = el.querySelector(".btn-first-stop");
          if (!btn) return;

          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();

            const sid = btn.getAttribute("data-stop-id");
            const stopId = Number(sid);
            if (!isFinite(stopId)) return;

            setFirstStop(stopId);
          }, { passive: false });
        } catch (err) {
          console.log("popupopen handler error", err);
        }
      });

      (function enableLongPressPin() {
        const container = map.getContainer();
        let pressTimer = null;
        let startX = 0, startY = 0;
        let activePointerId = null;
        let moved = false;

        const HOLD_MS = 550;
        const MOVE_PX = 12;

        function clearPress() {
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
          activePointerId = null;
          moved = false;
        }

        function createPinnedStop(lat, lng, addressText) {
          const id = "pinned_" + Date.now();
          const stop = {
            id,
            lat,
            lng,
            done: false,
            label: "📍",
            address: addressText || "Точка на карті",
            regionGroup: 0,
            regionColor: "#a855f7",
            isPinned: true
          };

          stops.push(stop);
          addStopMarker(stop);
          savePinnedStops();
          selectStop(stop.id);
          map.setView([lat, lng], Math.max(map.getZoom(), 16));
          syncBarsHeight();
        }

        function createPinnedAt(latlng) {
          createPinnedStop(latlng.lat, latlng.lng, "Точка на карті");
        }

        map.on("movestart zoomstart rotatestart dragstart", clearPress);

        container.addEventListener("pointerdown", (e) => {
          if (activePointerId !== null) return;
          activePointerId = e.pointerId;
          startX = e.clientX;
          startY = e.clientY;
          moved = false;

          pressTimer = setTimeout(() => {
            pressTimer = null;
            if (moved) return;

            if (e.target && (e.target.closest(".leaflet-marker-pane") || e.target.closest(".leaflet-control"))) {
              return;
            }

            const latlng = map.mouseEventToLatLng(e);
            if (!latlng) return;

            try { if (navigator.vibrate) navigator.vibrate(25); } catch (_) { }

            createPinnedAt(latlng);
          }, HOLD_MS);
        }, { passive: true });

        container.addEventListener("pointermove", (e) => {
          if (activePointerId !== e.pointerId) return;
          const dx = Math.abs(e.clientX - startX);
          const dy = Math.abs(e.clientY - startY);
          if (dx > MOVE_PX || dy > MOVE_PX) {
            moved = true;
            clearPress();
          }
        }, { passive: true });

        container.addEventListener("pointerup", (e) => {
          if (activePointerId !== e.pointerId) return;
          clearPress();
        }, { passive: true });

        container.addEventListener("pointercancel", clearPress, { passive: true });
        container.addEventListener("pointerleave", clearPress, { passive: true });

        window.__createPinnedStop = createPinnedStop;
      })();

      // Nominatim Search (твій код — без змін)
      const NOMINATIM_URL = "https://nominatim.openstreetmap.org/search";
      const NOMINATIM_LIMIT = 6;
      const CONTACT_EMAIL = "";

      const searchCache = new Map();
      let debounceTimer = null;
      let lastRequestAt = 0;
      let inFlight = false;
      let pendingQuery = "";

      function normalizeQuery(q) {
        return String(q || "").trim().replace(/\s+/g, " ");
      }

      function showResults(items) {
        if (!items || !items.length) {
          searchResults.style.display = "block";
          searchResults.innerHTML = `<div class="sr-muted">Нічого не знайдено</div>`;
          syncBarsHeight();
          return;
        }
        searchResults.style.display = "block";
        searchResults.innerHTML = items.map((it, idx) => `
        <div class="sr-item" data-idx="${idx}">
          ${it.display_name}
        </div>
      `).join("");

        Array.from(searchResults.querySelectorAll(".sr-item")).forEach(el => {
          el.addEventListener("click", () => {
            const i = Number(el.getAttribute("data-idx"));
            const r = items[i];
            if (!r) return;
            searchResults.style.display = "none";

            const lat = Number(r.lat);
            const lon = Number(r.lon);
            if (!isFinite(lat) || !isFinite(lon)) return;

            if (window.__createPinnedStop) {
              window.__createPinnedStop(lat, lon, r.display_name);
            } else {
              map.setView([lat, lon], 16);
            }

            searchInput.value = "";
            syncBarsHeight();
          });
        });

        syncBarsHeight();
      }

      function hideResults() {
        searchResults.style.display = "none";
        searchResults.innerHTML = "";
        syncBarsHeight();
      }

      async function nominatimSearch(query) {
        const q = normalizeQuery(query);
        if (!q) return [];

        if (searchCache.has(q)) return searchCache.get(q);

        const now = Date.now();
        const wait = Math.max(0, 1100 - (now - lastRequestAt));
        if (wait > 0) await new Promise(res => setTimeout(res, wait));
        lastRequestAt = Date.now();

        const url = new URL(NOMINATIM_URL);
        url.searchParams.set("format", "json");
        url.searchParams.set("q", q);
        url.searchParams.set("limit", String(NOMINATIM_LIMIT));
        url.searchParams.set("addressdetails", "0");
        if (CONTACT_EMAIL) url.searchParams.set("email", CONTACT_EMAIL);

        const resp = await fetch(url.toString(), {
          method: "GET",
          headers: {
            "Accept": "application/json",
            "Accept-Language": "uk,en;q=0.8,de;q=0.6"
          }
        });

        if (!resp.ok) throw new Error("Nominatim HTTP " + resp.status);

        const data = await resp.json();
        const arr = Array.isArray(data) ? data : [];
        searchCache.set(q, arr);
        return arr;
      }

      async function runSearch(query) {
        const q = normalizeQuery(query);
        if (!q) { hideResults(); return; }

        pendingQuery = q;
        if (inFlight) return;

        inFlight = true;
        try {
          const results = await nominatimSearch(pendingQuery);
          showResults(results);
        } catch (e) {
          searchResults.style.display = "block";
          searchResults.innerHTML = `<div class="sr-muted">Помилка пошуку (Nominatim). Спробуй ще раз.</div>`;
          syncBarsHeight();
        } finally {
          inFlight = false;

          const latest = normalizeQuery(searchInput.value);
          if (latest && latest !== pendingQuery) {
            runSearch(latest);
          }
        }
      }

      function scheduleSearch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => runSearch(searchInput.value), 500);
      }

      searchInput.addEventListener("input", scheduleSearch);
      btnSearch.addEventListener("click", () => runSearch(searchInput.value));

      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          runSearch(searchInput.value);
        }
        if (e.key === "Escape") {
          hideResults();
          searchInput.blur();
        }
      });

      document.addEventListener("click", (e) => {
        const t = e.target;
        if (!t) return;
        if (t.closest("#topbar") || t.closest("#search-results")) return;
        hideResults();
      });

      // Геолокація (твій код — без змін)
      let userMarker = null;
      let lastUserPos = null;
      let watchId = null;

      function animateLatLngCircleMarker(marker, from, to, duration = 500) {
        const start = performance.now();
        const lat1 = from[0], lng1 = from[1];
        const lat2 = to[0], lng2 = to[1];

        function step(now) {
          const t = Math.min(1, (now - start) / duration);
          const lat = lat1 + (lat2 - lat1) * t;
          const lng = lng1 + (lng2 - lng1) * t;
          marker.setLatLng([lat, lng]);
          if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      let followEnabled = false;

      function setFollowUI() {
        if (followEnabled) btnFollow.classList.add("active");
        else btnFollow.classList.remove("active");
      }

      function enableFollow() {
        followEnabled = true;
        setFollowUI();
        if (lastUserPos) map.panTo(lastUserPos, { animate: true });
      }

      function disableFollow() {
        followEnabled = false;
        setFollowUI();
      }

      btnFollow.addEventListener("click", () => {
        if (followEnabled) disableFollow();
        else enableFollow();
      });

      if (navigator.geolocation) {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);

        watchId = navigator.geolocation.watchPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            const latlng = [latitude, longitude];

            if (userMarker && accuracy && accuracy > 120) return;

            if (!userMarker) {
              userMarker = L.circleMarker(latlng, {
                radius: 8,
                fillColor: "#4ade80",
                color: "#22c55e",
                weight: 2,
                opacity: 1,
                fillOpacity: 1,
              }).addTo(map);
              userMarker.bindPopup("Ти тут 😊");
              lastUserPos = latlng;
            } else {
              animateLatLngCircleMarker(userMarker, lastUserPos, latlng, 500);
              lastUserPos = latlng;
            }

            if (followEnabled && lastUserPos) map.panTo(lastUserPos, { animate: true });
          },
          (err) => {
            console.log("Geo error", err);
          },
          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 8000
          }
        );
      }

      // ===============================
      // Кнопки
      // ===============================
      btnComplete.addEventListener("click", () => {
        if (selectedStopId == null) return;
        const stop = getStopById(selectedStopId);
        if (!stop) return;

        if (stop.isPinned) return;

        stop.done = true;
        updateMarkerStyle(stop.id);
        renderInfo();

        if (tg) {
          tg.sendData(JSON.stringify({ action: "complete", stop_id: stop.id }));
        } else {
          console.log("Demo complete:", stop.id);
        }
      });

      btnUndo.addEventListener("click", () => {
        if (tg) {
          tg.sendData(JSON.stringify({ action: "undo" }));
        } else {
          console.log("Demo undo");
        }
      });

      btnGmaps.addEventListener("click", () => {
        if (!currentGmapsUrl) return;
        window.open(currentGmapsUrl, "_blank");
      });

      btnDelPin.addEventListener("click", () => {
        const stop = getStopById(selectedStopId);
        if (!stop || !stop.isPinned) return;

        const marker = markers.get(stop.id);
        if (marker) {
          try { map.removeLayer(marker); } catch (e) { }
          markers.delete(stop.id);
        }

        stops = stops.filter(s => s.id !== stop.id);
        savePinnedStops();

        selectedStopId = stops[0] ? stops[0].id : null;
        if (selectedStopId !== null) selectStop(selectedStopId, false);
        else {
          infoEl.innerHTML = "";
          btnGmaps.disabled = true;
          btnDelPin.style.display = "none";
          btnFirst.style.display = "none";
        }

        syncBarsHeight();
      });

      /* ✅ НОВЕ: кнопка "1️⃣ Перша" знизу — завжди працює на телефоні */
      btnFirst.addEventListener("click", () => {
        const stop = getStopById(selectedStopId);
        if (!stop || stop.isPinned) return;
        setFirstStop(stop.id);
      });

      // ✅ Після старту — синхронізуємо висоти
      syncBarsHeight();
      setTimeout(syncBarsHeight, 50);
      setTimeout(syncBarsHeight, 250);
      window.addEventListener("resize", syncBarsHeight);

      // ====== Глобальна функція для Telegram sendData ======
      function setFirstStop(stopId) {
        if (!stopId) return;

        if (tg) {
          tg.sendData(JSON.stringify({
            action: "set_first",
            stop_id: stopId
          }));
        } else {
          console.log("Demo set_first:", stopId);
        }
      }

      // робимо доступною для інших місць (якщо треба)
      window.setFirstStop = setFirstStop;
    }
  </script>
