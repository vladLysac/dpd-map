<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening app…</title>
</head>
<body>
<script>
  const hash = window.location.hash || "";

  // Відкриття Android додатку
  const appUrl = "dpdmap://open" + hash;

  // Fallback на веб-карту (важливо: ім'я файлу саме dpd_map.html)
  const webUrl = "dpd_map.html" + hash;

  window.location.href = appUrl;

  setTimeout(() => {
    window.location.href = webUrl;
  }, 1200);
</script>

<p>Відкриваю додаток… Якщо не вийшло — відкрию карту.</p>
</body>
</html>
