<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening app…</title>
</head>
<body>

<script>
(function () {

  // Беремо хеш (#r=...) якщо є
  const hash = window.location.hash || "";

  // Deeplink для Android
  const appUrl = "dpdmap://open" + hash;

  // Абсолютний fallback на веб-карту (ВАЖЛИВО)
  const webUrl = "https://vladlysac.github.io/dpd-map/dpd_map.html" + hash;

  // Пробуємо відкрити додаток
  window.location.replace(appUrl);

  // Якщо не відкрився — перекидаємо на веб через 1 секунду
  setTimeout(function () {
    window.location.replace(webUrl);
  }, 1000);

})();
</script>

<p>Відкриваю додаток… Якщо не вийшло — відкрию карту.</p>

</body>
</html>
